name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update manifest version
        run: |
          sed -i "s/\"version\": \".*\"/\"version\": \"${{ steps.version.outputs.VERSION }}\"/" manifest.json

      - name: Package extension zip
        run: |
          mkdir -p dist
          zip -r "dist/homarr-helper-${{ steps.version.outputs.VERSION }}.zip" \
            manifest.json \
            background.js \
            popup.html \
            popup.js \
            options.html \
            options.js \
            newtab.html \
            newtab.js \
            i18n-core.js \
            i18n.js \
            icon48.png \
            icon128.png \
            _locales/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Homarr Helper ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: dist/homarr-helper-${{ steps.version.outputs.VERSION }}.zip
